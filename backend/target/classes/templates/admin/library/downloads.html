<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Downloads</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='downloads')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/library}">Digital Library</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Download Logs</span>
            </nav>
            <div class="admin-topbar-right">
                <a th:href="@{/admin/library}" class="btn-secondary" style="font-size:0.8rem;padding:0.45rem 0.9rem;">
                    <i class="fa-solid fa-folder-open"></i> Libraries
                </a>
            </div>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Download Logs</h1>
                    <p class="admin-page-subtitle">Track music download activities by listeners.</p>
                </div>
            </div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-download"></i> Download History</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${downloads.size()} + ' records'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:80px;">ID</th>
                                <th>Listener</th>
                                <th>Album</th>
                                <th>Date &amp; Time</th>
                                <th>Format</th>
                                <th>File Size</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${downloads.isEmpty()}">
                                <td colspan="7" style="text-align:center;padding:3rem;color:var(--text-muted);">No download logs found.</td>
                            </tr>
                            <tr th:each="d : ${downloads}">
                                <td><strong th:text="'#' + ${d[0]}">#1</strong></td>
                                <td style="font-weight:600;" th:text="${d[1]}">Listener</td>
                                <td th:text="${d[2]}">Album</td>
                                <td style="font-size:0.85rem;" th:text="${d[3]}">2026-01-01 12:00</td>
                                <td><span class="badge badge-gray" th:text="${d[4]}">MP3</span></td>
                                <td style="font-size:0.85rem;" th:text="${d[5]} != null ? ${d[5]} + ' MB' : '—'">—</td>
                                <td>
                                    <span class="badge" th:classappend="${d[6] == 'Completed' ? 'badge-active' : 'badge-pending'}" th:text="${d[6]}">Completed</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
