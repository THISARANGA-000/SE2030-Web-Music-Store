<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formMode == 'add' ? 'Add Catalog' : 'Edit Catalog'} + ' | Admin'">Catalog Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='catalogs')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/catalog/catalogs}">Catalogs</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current" th:text="${formMode == 'add' ? 'Add Catalog' : 'Edit Catalog #' + catalog.catalogId}">Form</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title" th:text="${formMode == 'add' ? 'Add New Catalog Bundle' : 'Edit Catalog Bundle'}">Catalog Form</h1>
                    <p class="admin-page-subtitle">Configure bundle information and assign included albums.</p>
                </div>
                <a th:href="@{/admin/catalog/catalogs}" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>

            <div class="admin-form-card" style="max-width:900px;">
                <form th:action="${formMode == 'add' ? '/admin/catalog/catalogs/add' : '/admin/catalog/catalogs/edit/' + catalog.catalogId}"
                      method="post" id="catalogForm">
                    <div class="admin-form-grid">
                        <div class="form-group full-width">
                            <label class="form-label" for="catalogName"><i class="fa-solid fa-layer-group"></i> Catalog Name *</label>
                            <input type="text" id="catalogName" name="catalogName" class="form-control"
                                   th:value="${catalog.catalogName}" required maxlength="100" placeholder="e.g. Summer Hits Bundle">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="price"><i class="fa-solid fa-dollar-sign"></i> Bundle Price *</label>
                            <input type="number" id="price" name="price" class="form-control"
                                   th:value="${catalog.price}" required step="0.01" min="0" placeholder="0.00">
                        </div>
                        <div class="form-group full-width">
                            <label class="form-label" for="description"><i class="fa-solid fa-align-left"></i> Description</label>
                            <textarea id="description" name="description" class="form-control" rows="3"
                                      placeholder="Provide details about the bundle contents..." th:text="${catalog.description}"></textarea>
                        </div>
                    </div>

                    <!-- Album Selection Section -->
                    <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border-color);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
                            <div>
                                <label class="form-label" style="font-size:1.05rem; font-weight:700; margin-bottom:0.25rem;">
                                    <i class="fa-solid fa-compact-disc" style="color:var(--brand-primary);"></i> Included Albums
                                </label>
                                <p style="font-size:0.85rem; color:var(--text-muted); margin:0;">
                                    Select the albums that belong to this catalog. Check to add, uncheck to remove.
                                </p>
                            </div>
                            <div style="display:flex; gap:0.5rem;">
                                <button type="button" class="btn-secondary" style="font-size:0.8rem; padding:0.35rem 0.75rem;" onclick="toggleAllAlbums(true)">
                                    <i class="fa-solid fa-check-double"></i> Select All
                                </button>
                                <button type="button" class="btn-secondary" style="font-size:0.8rem; padding:0.35rem 0.75rem;" onclick="toggleAllAlbums(false)">
                                    <i class="fa-solid fa-xmark"></i> Deselect All
                                </button>
                            </div>
                        </div>

                        <div th:if="${albums == null or albums.isEmpty()}" style="padding:2rem; text-align:center; color:var(--text-muted); background:var(--bg-base); border-radius:var(--radius-md);">
                            No albums available to assign.
                        </div>

                        <div th:if="${albums != null and !albums.isEmpty()}"
                             style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:0.75rem; max-height:420px; overflow-y:auto; padding:0.5rem; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-base);">
                            <label th:each="a : ${albums}"
                                   th:for="'album_' + ${a.albumId}"
                                   style="display:flex; align-items:center; gap:0.75rem; padding:0.65rem 0.85rem; background:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-sm); cursor:pointer; transition:all var(--transition);"
                                   class="album-select-item">
                                <input type="checkbox"
                                       name="albumIds"
                                       th:id="'album_' + ${a.albumId}"
                                       th:value="${a.albumId}"
                                       th:checked="${selectedAlbumIds != null and selectedAlbumIds.contains(a.albumId)}"
                                       style="width:18px; height:18px; accent-color:var(--brand-primary); cursor:pointer;">
                                <img th:src="${a.coverImageUrl != null and !a.coverImageUrl.isEmpty()} ? @{${a.coverImageUrl}} : 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=60'"
                                     th:alt="${a.albumTitle}"
                                     style="width:40px; height:40px; border-radius:var(--radius-xs); object-fit:cover; border:1px solid var(--border-color);"
                                     onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=60'">
                                <div style="flex:1; min-width:0;">
                                    <div style="font-weight:600; font-size:0.9rem; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"
                                         th:text="${a.albumTitle}">Album Title</div>
                                    <div style="font-size:0.75rem; color:var(--text-muted); display:flex; justify-content:space-between; margin-top:2px;">
                                        <span th:text="${a.artist != null ? a.artist.artistName : 'Unknown'}">Artist</span>
                                        <span style="font-weight:700; color:var(--brand-gold);" th:text="'$' + ${#numbers.formatDecimal(a.price, 1, 2)}">$9.99</span>
                                    </div>
                                    <div th:if="${a.catalog != null and (formMode == 'add' or (catalog.catalogId != null and a.catalog.catalogId != catalog.catalogId))}"
                                         style="font-size:0.7rem; color:var(--warning); margin-top:2px;">
                                        <i class="fa-solid fa-circle-info"></i> In: <span th:text="${a.catalog.catalogName}">Other Catalog</span>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="admin-form-actions" style="margin-top:2rem;">
                        <button type="submit" class="btn-primary" id="saveCatalogBtn">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span th:text="${formMode == 'add' ? 'Create Catalog' : 'Save Changes'}">Save</span>
                        </button>
                        <a th:href="@{/admin/catalog/catalogs}" class="btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>

<script>
function toggleAllAlbums(selectAll) {
    const checkboxes = document.querySelectorAll('input[name="albumIds"]');
    checkboxes.forEach(cb => cb.checked = selectAll);
}
</script>
</body>
</html>
