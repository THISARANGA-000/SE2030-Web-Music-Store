<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formMode == 'add' ? 'Add Genre' : 'Edit Genre'} + ' | MelodyMart Admin'">Genre Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='genres')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/catalog/genres}">Genres</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current" th:text="${formMode == 'add' ? 'Add New' : 'Edit'}">Form</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div><h1 class="admin-page-title" th:text="${formMode == 'add' ? 'Add New Genre' : 'Edit Genre'}">Genre Form</h1></div>
                <a th:href="@{/admin/catalog/genres}" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>
            <div class="admin-form-card">
                <form th:action="${formMode == 'add' ? '/admin/catalog/genres/add' : '/admin/catalog/genres/edit/' + genre.genreId}"
                      method="post" id="genreForm">
                    <div class="admin-form-grid">
                        <div class="form-group full-width">
                            <label class="form-label" for="genreName"><i class="fa-solid fa-tags"></i> Genre Name *</label>
                            <input type="text" id="genreName" name="genreName" class="form-control"
                                   th:value="${genre.genreName}" required maxlength="50" placeholder="e.g. Electronic">
                        </div>
                        <div class="form-group full-width">
                            <label class="form-label" for="description"><i class="fa-solid fa-align-left"></i> Description</label>
                            <textarea id="description" name="description" class="form-control" rows="3"
                                      placeholder="Genre description..." th:text="${genre.description}"></textarea>
                        </div>
                    </div>
                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" id="saveGenreBtn">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span th:text="${formMode == 'add' ? 'Add Genre' : 'Save Changes'}">Save</span>
                        </button>
                        <a th:href="@{/admin/catalog/genres}" class="btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
