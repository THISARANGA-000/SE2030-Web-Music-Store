<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart | My Playlists</title>
    <meta name="description" content="Organize your music into personal playlists on MelodyMart.">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/listener-nav :: navbar(activeItem='playlists')}"></div>

<main class="container">
    <div class="page-header">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-list-music" style="color:var(--brand-primary); font-size:0.9em;"></i> My Playlists</h1>
                <p class="page-subtitle">Organize your favorite music into personal collections.</p>
            </div>
            <a th:href="@{/playlists/new}" class="btn-primary" id="createPlaylistBtn">
                <i class="fa-solid fa-plus"></i> Create Playlist
            </a>
        </div>
    </div>

    <!-- Alerts -->
    <div th:if="${successMsg}" class="alert alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMsg}"></span>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(playlists)}"
         style="text-align:center; padding:4rem 2rem; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);">
        <i class="fa-solid fa-music" style="font-size:3rem; color:var(--text-muted); margin-bottom:1rem;"></i>
        <h2 style="font-size:1.3rem; color:var(--text-primary); margin-bottom:0.5rem;">No playlists yet</h2>
        <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Create your first playlist to start organizing your music.</p>
        <a th:href="@{/playlists/new}" class="btn-primary">
            <i class="fa-solid fa-plus"></i> Create Your First Playlist
        </a>
    </div>

    <!-- Playlist grid -->
    <div th:unless="${#lists.isEmpty(playlists)}"
         style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1.25rem;">

        <div th:each="pl : ${playlists}"
             class="card"
             style="padding:1.5rem; display:flex; flex-direction:column; gap:0.75rem;">

            <!-- Playlist icon + name -->
            <div style="display:flex; align-items:center; gap:0.75rem;">
                <div style="width:48px; height:48px; background:var(--bg-subtle); border-radius:var(--radius-sm);
                            display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    <i class="fa-solid fa-list-music" style="color:var(--brand-primary); font-size:1.3rem;"></i>
                </div>
                <div>
                    <div style="font-size:1.05rem; font-weight:700; color:var(--text-primary);"
                         th:text="${pl.playlistName}">Playlist Name</div>
                    <div style="font-size:0.8rem; color:var(--text-muted);"
                         th:text="${#lists.size(pl.items)} + ' items · Created ' + ${pl.createdDate != null ? pl.createdDate.toLocalDate() : ''}">
                        0 items
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:auto;">
                <a th:href="@{'/playlists/' + ${pl.playlistId}}" class="btn-primary"
                   style="padding:0.45rem 0.9rem; font-size:0.85rem;">
                    <i class="fa-solid fa-eye"></i> View
                </a>
                <a th:href="@{'/playlists/' + ${pl.playlistId} + '/edit'}" class="btn-secondary"
                   style="padding:0.45rem 0.9rem; font-size:0.85rem;">
                    <i class="fa-solid fa-pen"></i> Rename
                </a>
                <form th:action="@{'/playlists/' + ${pl.playlistId} + '/delete'}" method="post"
                      onsubmit="return confirm('Delete playlist \'' + this.closest('.card').querySelector('[style*=font-weight]').textContent.trim() + '\'? This cannot be undone.');">
                    <button type="submit" class="btn-reset"
                            style="padding:0.45rem 0.9rem; font-size:0.85rem; background:var(--bg-subtle); color:var(--error); border:1px solid var(--border-color);">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

</main>

<footer class="footer">
    <p>&copy; 2026 MelodyMart Digital Music Store &mdash; All rights reserved.</p>
</footer>

</body>
</html>
