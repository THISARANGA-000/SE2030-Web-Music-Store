<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="navbar" th:fragment="navbar(activeItem)">
    <a th:href="@{/albums}" class="nav-brand">
        <span class="logo-icon"><i class="fa-solid fa-compact-disc"></i></span>
        <span th:text="${appSettings != null ? appSettings.storeName : 'MelodyMart'}">MelodyMart</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/albums}" class="nav-link" th:classappend="${activeItem == 'albums'} ? 'active'" id="navAlbums">
            <i class="fa-solid fa-record-vinyl"></i> Albums
        </a>
        <a th:href="@{/catalogs}" class="nav-link" th:classappend="${activeItem == 'catalogs'} ? 'active'" id="navCatalogs">
            <i class="fa-solid fa-layer-group"></i> Catalogs
        </a>
        <a th:href="@{/promotions}" class="nav-link" th:classappend="${activeItem == 'promotions'} ? 'active'" id="navPromotions">
            <i class="fa-solid fa-tags"></i> Promotions
        </a>
        <a th:href="@{/faqs}" class="nav-link" th:classappend="${activeItem == 'faqs'} ? 'active'" id="navFaqs">
            <i class="fa-solid fa-circle-question"></i> FAQs
        </a>
        <th:block th:if="${session.userId != null}">
            <th:block th:if="${session.userRole != 'ADMIN'}">
                <a th:href="@{/cart}" class="nav-link" th:classappend="${activeItem == 'cart'} ? 'active'" id="navCart">
                    <i class="fa-solid fa-cart-shopping"></i> Cart
                </a>
                <a th:href="@{/my-library}" class="nav-link" th:classappend="${activeItem == 'library'} ? 'active'" id="navLibrary">
                    <i class="fa-solid fa-music"></i> My Library
                </a>
                <a th:href="@{/playlists}" class="nav-link" th:classappend="${activeItem == 'playlists'} ? 'active'" id="navPlaylists">
                    <i class="fa-solid fa-list-music"></i> Playlists
                </a>
                <a th:href="@{/complaints}" class="nav-link" th:classappend="${activeItem == 'complaints'} ? 'active'" id="navComplaints">
                    <i class="fa-solid fa-triangle-exclamation"></i> My Complaints
                </a>
            </th:block>
            <a th:href="@{/profile}" class="nav-link" th:classappend="${activeItem == 'profile'} ? 'active'" id="navProfile">
                <i class="fa-solid fa-user"></i> Profile
            </a>
            <a th:if="${session.userRole == 'ADMIN'}" th:href="@{/admin/dashboard}" class="nav-link" style="color:var(--brand-gold);" id="navAdmin">
                <i class="fa-solid fa-gauge"></i> Admin Panel
            </a>
        </th:block>
    </nav>
    <div class="nav-user">
        <th:block th:if="${session.userId != null}">
            <div class="nav-avatar" th:text="${session.userName != null ? session.userName.substring(0,1).toUpperCase() : 'U'}">U</div>
            <span class="nav-username" th:text="${session.userName}">User</span>
            <a th:href="@{/logout}" class="nav-btn nav-btn-outline">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </th:block>
        <th:block th:unless="${session.userId != null}">
            <a th:href="@{/login}" class="nav-btn nav-btn-outline">Login</a>
            <a th:href="@{/register}" class="nav-btn nav-btn-primary">Sign Up</a>
        </th:block>
    </div>
</header>
</body>
</html>
