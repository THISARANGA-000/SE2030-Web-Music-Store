<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | MelodyMart Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='access-denied')}"></div>
    <div class="admin-content">
        <main class="admin-main" style="display:flex;align-items:center;justify-content:center;min-height:75vh;">
            <div style="text-align:center;max-width:500px;padding:3rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);">
                <div style="width:80px;height:80px;border-radius:50%;background:rgba(239,68,68,0.15);color:#ef4444;display:inline-flex;align-items:center;justify-content:center;font-size:2.2rem;margin-bottom:1.5rem;">
                    <i class="fa-solid fa-ban"></i>
                </div>
                <h1 style="font-size:1.8rem;font-weight:700;color:var(--text-primary);margin-bottom:0.75rem;">403 - Access Denied</h1>
                <p style="color:var(--text-muted);font-size:0.95rem;line-height:1.6;margin-bottom:1.75rem;">
                    Your account (<span th:text="${adminRole != null ? adminRole : 'Standard'}" style="font-weight:600;color:var(--color-primary);">Role</span>) does not have sufficient permissions to access this admin panel.
                </p>
                <div style="display:flex;gap:1rem;justify-content:center;">
                    <a th:href="@{/admin/dashboard}" class="btn-primary" style="padding:0.65rem 1.25rem;">
                        <i class="fa-solid fa-gauge"></i> Return to Dashboard
                    </a>
                    <a th:href="@{/albums}" class="btn-secondary" style="padding:0.65rem 1.25rem;">
                        <i class="fa-solid fa-store"></i> Store Front
                    </a>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
