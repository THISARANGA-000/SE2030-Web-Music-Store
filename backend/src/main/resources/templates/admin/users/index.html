<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Users</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='users')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">User Management</span>
            </nav>
            <div class="admin-topbar-right">
                <a th:href="@{/admin/administrators}" class="btn-secondary" style="font-size:0.8rem;padding:0.45rem 0.9rem;">
                    <i class="fa-solid fa-user-shield"></i> View Administrators
                </a>
            </div>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">User Accounts</h1>
                    <p class="admin-page-subtitle">Complete list of registered accounts across the platform.</p>
                </div>
            </div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-users"></i> All Users</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${users.size()} + ' users'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:70px;">ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Registered</th>
                                <th>Type / Role</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${users.isEmpty()}">
                                <td colspan="7" style="text-align:center;padding:3rem;color:var(--text-muted);">No users found.</td>
                            </tr>
                            <tr th:each="u : ${users}">
                                <td th:text="'#' + ${u[0]}">#1</td>
                                <td style="font-weight:600;" th:text="${u[1]} + ' ' + ${u[2]}">User Name</td>
                                <td th:text="${u[3]}">email@example.com</td>
                                <td style="color:var(--text-muted);" th:text="${u[4]} != null ? ${u[4]} : '—'">—</td>
                                <td style="font-size:0.85rem;" th:text="${u[5]}">2026-01-01</td>
                                <td>
                                    <span th:if="${u[7] == 'Admin'}" class="role-badge role-badge-super" th:text="${u[8] != '' ? u[8] : 'Admin'}">Admin</span>
                                    <span th:if="${u[7] != 'Admin'}" class="badge badge-gray">Listener</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${u[6] == 'Active' ? 'badge-active' : 'badge-suspended'}" th:text="${u[6]}">Active</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
