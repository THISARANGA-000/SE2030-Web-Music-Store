<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formMode == 'add' ? 'Add Artist' : 'Edit Artist'} + ' | MelodyMart Admin'">Artist Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='artists')}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/catalog/artists}">Artists</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current" th:text="${formMode == 'add' ? 'Add New' : 'Edit'}">Form</span>
            </nav>
        </div>

        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title" th:text="${formMode == 'add' ? 'Add New Artist' : 'Edit Artist'}">Artist Form</h1>
                </div>
                <a th:href="@{/admin/catalog/artists}" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>

            <div class="admin-form-card">
                <form th:action="${formMode == 'add' ? '/admin/catalog/artists/add' : '/admin/catalog/artists/edit/' + artist.artistId}"
                      method="post" id="artistForm">

                    <div class="admin-form-grid">
                        <div class="form-group full-width">
                            <label class="form-label" for="artistName"><i class="fa-solid fa-microphone-lines"></i> Artist Name *</label>
                            <input type="text" id="artistName" name="artistName" class="form-control"
                                   th:value="${artist.artistName}" required maxlength="100" placeholder="e.g. Aria Chen">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="country"><i class="fa-solid fa-globe"></i> Country</label>
                            <input type="text" id="country" name="country" class="form-control"
                                   th:value="${artist.country}" maxlength="50" placeholder="e.g. United States">
                        </div>
                        <div class="form-group full-width">
                            <label class="form-label" for="biography"><i class="fa-solid fa-align-left"></i> Biography</label>
                            <textarea id="biography" name="biography" class="form-control" rows="5"
                                      placeholder="Artist biography..."
                                      th:text="${artist.biography}"></textarea>
                        </div>
                    </div>

                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" id="saveArtistBtn">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span th:text="${formMode == 'add' ? 'Add Artist' : 'Save Changes'}">Save</span>
                        </button>
                        <a th:href="@{/admin/catalog/artists}" class="btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
