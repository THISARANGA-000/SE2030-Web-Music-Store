<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Genres</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='genres')}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Genres</span>
            </nav>
        </div>

        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Genre Management</h1>
                    <p class="admin-page-subtitle">Manage music genres in the MelodyMart catalog.</p>
                </div>
                <a th:href="@{/admin/catalog/genres/add}" class="btn-primary" id="addGenreBtn">
                    <i class="fa-solid fa-plus"></i> Add Genre
                </a>
            </div>

            <div th:if="${successMsg}" class="alert alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${successMsg}"></span></div>
            <div th:if="${errorMsg}" class="alert alert-error"><i class="fa-solid fa-circle-xmark"></i> <span th:text="${errorMsg}"></span></div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-tags"></i> All Genres</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${genres.size()} + ' genres'">0 genres</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="genresTable">
                        <thead>
                            <tr><th>#</th><th>Genre Name</th><th>Description</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${genres.isEmpty()}">
                                <td colspan="4" style="text-align:center;padding:3rem;color:var(--text-muted);">No genres found.</td>
                            </tr>
                            <tr th:each="g : ${genres}">
                                <td th:text="${g.genreId}">1</td>
                                <td><strong th:text="${g.genreName}">Name</strong></td>
                                <td th:text="${g.description != null ? g.description : '—'}">—</td>
                                <td>
                                    <div class="action-btns">
                                        <a th:href="@{/admin/catalog/genres/edit/{id}(id=${g.genreId})}" class="btn-view" title="Edit"><i class="fa-solid fa-pen"></i></a>
                                        <form th:action="@{/admin/catalog/genres/delete/{id}(id=${g.genreId})}" method="post"
                                              style="display:inline;" onsubmit="return confirm('Delete this genre? This will fail if albums use it.');">
                                            <button type="submit" class="btn-danger" style="padding:0.45rem 0.7rem;font-size:0.8rem;" title="Delete">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
