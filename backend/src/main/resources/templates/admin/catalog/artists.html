<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Artists</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='artists')}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Artists</span>
            </nav>
        </div>

        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Artist Management</h1>
                    <p class="admin-page-subtitle">Manage artists in the MelodyMart catalog.</p>
                </div>
                <a th:href="@{/admin/catalog/artists/add}" class="btn-primary" id="addArtistBtn">
                    <i class="fa-solid fa-plus"></i> Add Artist
                </a>
            </div>

            <div th:if="${successMsg}" class="alert alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${successMsg}"></span></div>
            <div th:if="${errorMsg}" class="alert alert-error"><i class="fa-solid fa-circle-xmark"></i> <span th:text="${errorMsg}"></span></div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-microphone-lines"></i> All Artists</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${artists.size()} + ' artists'">0 artists</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="artistsTable">
                        <thead>
                            <tr><th>#</th><th>Name</th><th>Country</th><th>Biography</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${artists.isEmpty()}">
                                <td colspan="5" style="text-align:center;padding:3rem;color:var(--text-muted);">No artists found.</td>
                            </tr>
                            <tr th:each="a : ${artists}">
                                <td th:text="${a.artistId}">1</td>
                                <td><strong th:text="${a.artistName}">Name</strong></td>
                                <td th:text="${a.country != null ? a.country : '—'}">—</td>
                                <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                    th:text="${a.biography != null ? a.biography : '—'}">—</td>
                                <td>
                                    <div class="action-btns">
                                        <a th:href="@{/admin/catalog/artists/edit/{id}(id=${a.artistId})}" class="btn-view" title="Edit"><i class="fa-solid fa-pen"></i></a>
                                        <form th:action="@{/admin/catalog/artists/delete/{id}(id=${a.artistId})}" method="post"
                                              style="display:inline;" onsubmit="return confirm('Delete this artist? This will fail if they have albums.');">
                                            <button type="submit" class="btn-danger" style="padding:0.45rem 0.7rem;font-size:0.8rem;" title="Delete">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
