<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formMode == 'add' ? 'Add Album' : 'Edit Album'} + ' | MelodyMart Admin'">Album Form | MelodyMart Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='albums')}"></div>

    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/catalog/albums}">Albums</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current" th:text="${formMode == 'add' ? 'Add New' : 'Edit'}">Form</span>
            </nav>
        </div>

        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title" th:text="${formMode == 'add' ? 'Add New Album' : 'Edit Album'}">Album Form</h1>
                    <p class="admin-page-subtitle" th:text="${formMode == 'add' ? 'Create a new album in the catalog.' : 'Update album details.'}">Form</p>
                </div>
                <a th:href="@{/admin/catalog/albums}" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Albums</a>
            </div>

            <div class="admin-form-card">
                <form th:action="${formMode == 'add' ? '/admin/catalog/albums/add' : '/admin/catalog/albums/edit/' + album.albumId}"
                      method="post" id="albumForm">

                    <div class="admin-form-grid">

                        <div class="form-group full-width">
                            <label class="form-label" for="albumTitle"><i class="fa-solid fa-record-vinyl"></i> Album Title *</label>
                            <input type="text" id="albumTitle" name="albumTitle" class="form-control"
                                   th:value="${album.albumTitle}" required placeholder="e.g. Midnight Echoes" maxlength="150">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="artistId"><i class="fa-solid fa-microphone-lines"></i> Artist *</label>
                            <select id="artistId" name="artistId" class="form-control select-control" required>
                                <option value="">— Select Artist —</option>
                                <option th:each="a : ${artists}"
                                        th:value="${a.artistId}"
                                        th:text="${a.artistName}"
                                        th:selected="${album.artist != null and album.artist.artistId == a.artistId}">Artist</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="genreId"><i class="fa-solid fa-tags"></i> Genre *</label>
                            <select id="genreId" name="genreId" class="form-control select-control" required>
                                <option value="">— Select Genre —</option>
                                <option th:each="g : ${genres}"
                                        th:value="${g.genreId}"
                                        th:text="${g.genreName}"
                                        th:selected="${album.genre != null and album.genre.genreId == g.genreId}">Genre</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="price"><i class="fa-solid fa-dollar-sign"></i> Price *</label>
                            <input type="number" id="price" name="price" class="form-control"
                                   th:value="${album.price}" required step="0.01" min="0" placeholder="0.00">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="albumStatus"><i class="fa-solid fa-circle-dot"></i> Status *</label>
                            <select id="albumStatus" name="albumStatus" class="form-control select-control" required>
                                <option value="Available"    th:selected="${album.albumStatus == 'Available'}">Available</option>
                                <option value="Unavailable"  th:selected="${album.albumStatus == 'Unavailable'}">Unavailable</option>
                                <option value="ComingSoon"   th:selected="${album.albumStatus == 'ComingSoon'}">Coming Soon</option>
                                <option value="Discontinued" th:selected="${album.albumStatus == 'Discontinued'}">Discontinued</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="releaseDate"><i class="fa-solid fa-calendar"></i> Release Date</label>
                            <input type="date" id="releaseDate" name="releaseDate" class="form-control"
                                   th:value="${album.releaseDate}">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="catalogId"><i class="fa-solid fa-layer-group"></i> Catalog Bundle</label>
                            <select id="catalogId" name="catalogId" class="form-control select-control">
                                <option value="">— No Catalog —</option>
                                <option th:each="c : ${catalogs}"
                                        th:value="${c.catalogId}"
                                        th:text="${c.catalogName}"
                                        th:selected="${album.catalog != null and album.catalog.catalogId == c.catalogId}">Catalog</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label" for="coverImageUrl"><i class="fa-solid fa-image"></i> Cover Image URL / Path (Optional)</label>
                            <input type="text" id="coverImageUrl" name="coverImageUrl" class="form-control"
                                   th:value="${album.coverImageUrl}" placeholder="e.g. /assets/covers/sanda_eliya.jpg or https://images.unsplash.com/..." maxlength="255">
                            <small style="display:block; margin-top:0.35rem; color:var(--text-muted); font-size:0.8rem;">
                                <i class="fa-solid fa-circle-info"></i>
                                Enter a web path (e.g. <code>/assets/covers/sanda_eliya.jpg</code>) or a direct web URL (e.g. <code>https://...</code>).
                                <span th:if="${formMode == 'edit'}">Leave blank to keep current cover image.</span>
                            </small>
                            <div th:if="${formMode == 'edit' and album.coverImageUrl != null and !album.coverImageUrl.isEmpty()}"
                                 style="margin-top:0.6rem; display:flex; align-items:center; gap:0.75rem; background:var(--bg-subtle); padding:0.5rem 0.75rem; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
                                <span style="font-size:0.8rem; color:var(--text-secondary); font-weight:600;">Current Cover:</span>
                                <img th:src="@{${album.coverImageUrl}}"
                                     onerror="this.src='https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100&auto=format&fit=crop&q=60'"
                                     style="width:40px; height:40px; object-fit:cover; border-radius:var(--radius-xs); border:1px solid var(--border-color);"
                                     alt="Current Cover">
                                <span style="font-size:0.8rem; color:var(--text-muted);" th:text="${album.coverImageUrl}"></span>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label" for="description"><i class="fa-solid fa-align-left"></i> Description</label>
                            <textarea id="description" name="description" class="form-control"
                                      rows="4" placeholder="Album description..."
                                      th:text="${album.description}"></textarea>
                        </div>

                    </div>

                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" id="saveAlbumBtn">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span th:text="${formMode == 'add' ? 'Add Album' : 'Save Changes'}">Save</span>
                        </button>
                        <a th:href="@{/admin/catalog/albums}" class="btn-secondary">
                            <i class="fa-solid fa-xmark"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </main>

        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
