<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Tracks</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='tracks')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Tracks</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Track Management</h1>
                    <p class="admin-page-subtitle">View all tracks across all albums.</p>
                </div>
                <div>
                    <a th:href="@{/admin/catalog/tracks/add}" class="btn-primary">
                        <i class="fa-solid fa-plus"></i> Add New Track
                    </a>
                </div>
            </div>
            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-music"></i> All Tracks</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${tracks.size()} + ' tracks'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="tracksTable">
                        <thead>
                            <tr><th>#</th><th>Track</th><th>Album</th><th>No.</th><th>Duration</th><th>Audio URL</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${tracks.isEmpty()}">
                                <td colspan="7" style="text-align:center;padding:3rem;color:var(--text-muted);">No tracks found.</td>
                            </tr>
                            <tr th:each="t : ${tracks}">
                                <td th:text="${t[0]}">1</td>
                                <td><strong th:text="${t[3]}">Track Title</strong></td>
                                <td th:text="${t[1]}">Album</td>
                                <td th:text="${t[2]}">1</td>
                                <td th:text="${t[4]}">0</td>
                                <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.78rem;"
                                    th:text="${t[5]}">url</td>
                                <td>
                                    <div style="display:flex; gap:0.5rem;">
                                        <a th:href="@{/admin/catalog/tracks/edit/{id}(id=${t[0]})}" class="btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.8rem;">Edit</a>
                                        <form th:action="@{/admin/catalog/tracks/delete/{id}(id=${t[0]})}" method="post" onsubmit="return confirm('Delete this track?');">
                                            <button type="submit" class="btn-danger" style="padding:0.25rem 0.5rem;font-size:0.8rem;">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
