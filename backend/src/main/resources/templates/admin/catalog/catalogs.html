<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Catalogs</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='catalogs')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Catalogs</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Catalog Management</h1>
                    <p class="admin-page-subtitle">Manage album bundle catalogs.</p>
                </div>
                <a th:href="@{/admin/catalog/catalogs/add}" class="btn-primary" id="addCatalogBtn">
                    <i class="fa-solid fa-plus"></i> Add Catalog
                </a>
            </div>
            <div th:if="${successMsg}" class="alert alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${successMsg}"></span></div>
            <div th:if="${errorMsg}"   class="alert alert-error"><i class="fa-solid fa-circle-xmark"></i> <span th:text="${errorMsg}"></span></div>
            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-layer-group"></i> All Catalogs</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${catalogs.size()} + ' catalogs'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="catalogsTable">
                        <thead><tr><th>#</th><th>Name</th><th>Price</th><th>Description</th><th>Created</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:if="${catalogs.isEmpty()}">
                                <td colspan="6" style="text-align:center;padding:3rem;color:var(--text-muted);">No catalogs found.</td>
                            </tr>
                            <tr th:each="c : ${catalogs}">
                                <td th:text="${c.catalogId}">1</td>
                                <td><strong th:text="${c.catalogName}">Name</strong></td>
                                <td style="color:var(--brand-gold);font-weight:700;" th:text="'$' + ${#numbers.formatDecimal(c.price,1,2)}">$0.00</td>
                                <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                    th:text="${c.description != null ? c.description : '—'}">—</td>
                                <td th:text="${c.createdDate != null ? c.createdDate.toLocalDate().toString() : '—'}">—</td>
                                <td>
                                    <div class="action-btns">
                                        <a th:href="@{/admin/catalog/catalogs/edit/{id}(id=${c.catalogId})}" class="btn-view"><i class="fa-solid fa-pen"></i></a>
                                        <form th:action="@{/admin/catalog/catalogs/delete/{id}(id=${c.catalogId})}" method="post" style="display:inline;"
                                              onsubmit="return confirm('Delete this catalog?');">
                                            <button type="submit" class="btn-danger" style="padding:0.45rem 0.7rem;font-size:0.8rem;"><i class="fa-solid fa-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
