<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Payments</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='payments')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/orders}">Orders</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Payments</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Payment Records</h1>
                    <p class="admin-page-subtitle">View all payment transactions.</p>
                </div>
            </div>
            <div th:if="${successMsg}" class="alert alert-success" style="margin-bottom:1.5rem;"><i class="fa-solid fa-circle-check"></i> <span th:text="${successMsg}"></span></div>
            <div th:if="${errorMsg}"   class="alert alert-error" style="margin-bottom:1.5rem;"><i class="fa-solid fa-circle-xmark"></i> <span th:text="${errorMsg}"></span></div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-credit-card"></i> All Payments</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${payments.size()} + ' records'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="paymentsTable">
                        <thead>
                            <tr><th>Payment ID</th><th>Customer</th><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${payments.isEmpty()}">
                                <td colspan="8" style="text-align:center;padding:3rem;color:var(--text-muted);">No payments found.</td>
                            </tr>
                            <tr th:each="p : ${payments}">
                                <td th:text="${p[0]}">—</td>
                                <td th:text="${p[2]}">Customer</td>
                                <td th:text="${p[3] != null ? p[3].toString().substring(0,10) : '—'}">—</td>
                                <td style="color:var(--brand-gold);font-weight:700;" th:text="'$' + ${#numbers.formatDecimal(p[4],1,2)}">$0.00</td>
                                <td th:text="${p[5]}">—</td>
                                <td style="font-size:0.75rem;" th:text="${p[6] != null ? p[6] : '—'}">—</td>
                                <td>
                                    <span th:switch="${p[7]}">
                                        <span th:case="'Completed'" class="chip chip-green"  th:text="${p[7]}">—</span>
                                        <span th:case="'Pending'"   class="chip chip-yellow" th:text="${p[7]}">—</span>
                                        <span th:case="'Failed'"    class="chip chip-red"    th:text="${p[7]}">—</span>
                                        <span th:case="*"           class="chip chip-gray"   th:text="${p[7]}">—</span>
                                    </span>
                                </td>
                                <td style="display:flex; gap:0.4rem; align-items:center;">
                                    <a th:href="@{/admin/payments/{id}(id=${p[0]})}" class="btn-view" title="View Payment Detail">
                                        <i class="fa-solid fa-eye"></i> View
                                    </a>
                                    <form th:action="@{/admin/payments/{id}/delete(id=${p[0]})}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this payment record?');">
                                        <button type="submit" class="btn-danger" style="font-size:0.75rem; padding:0.35rem 0.65rem; background:linear-gradient(135deg,#ef4444,#dc2626); border:none; border-radius:4px; color:#fff; cursor:pointer;" title="Delete Payment">
                                            <i class="fa-solid fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
