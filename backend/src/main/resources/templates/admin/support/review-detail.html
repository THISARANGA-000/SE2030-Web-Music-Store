<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'MelodyMart Admin | Review #' + ${review[0]}">MelodyMart Admin | Review Detail</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='reviews')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <a th:href="@{/admin/support/reviews}">Reviews</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current" th:text="'Review #' + ${review[0]}">Detail</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title" th:text="'Review #' + ${review[0]}">Review Details</h1>
                    <p class="admin-page-subtitle" th:text="'Customer review for ' + ${review[2]}">Review for Album</p>
                </div>
                <div style="display:flex; gap:0.5rem;">
                    <form th:action="@{/admin/support/reviews/{id}/delete(id=${review[0]})}" method="post"
                          onsubmit="return confirm('Are you sure you want to delete this review?');">
                        <button type="submit" class="btn-secondary" style="color:#ef4444; border-color:#fca5a5;">
                            <i class="fa-solid fa-trash"></i> Delete Review
                        </button>
                    </form>
                    <a th:href="@{/admin/support/reviews}" class="btn-secondary">
                        <i class="fa-solid fa-arrow-left"></i> Back to Reviews
                    </a>
                </div>
            </div>

            <div class="admin-form-card" style="max-width:850px;">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1.25rem; margin-bottom:1.5rem; padding-bottom:1.25rem; border-bottom:1px solid var(--border-color);">
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; display:block; margin-bottom:0.25rem;">Review ID</span>
                        <span style="font-size:1.1rem; font-weight:700; color:var(--text-primary);" th:text="'#' + ${review[0]}">#1</span>
                    </div>
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; display:block; margin-bottom:0.25rem;">Album</span>
                        <a th:if="${review.length > 6 and review[6] != null}" th:href="@{'/albums/' + ${review[6]}}" 
                           style="font-size:1.1rem; font-weight:700; color:var(--brand-primary); text-decoration:none;" th:text="${review[2]}">Album Title</a>
                        <span th:unless="${review.length > 6 and review[6] != null}" 
                              style="font-size:1.1rem; font-weight:700; color:var(--text-primary);" th:text="${review[2]}">Album Title</span>
                    </div>
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; display:block; margin-bottom:0.25rem;">Listener / Reviewer</span>
                        <a th:if="${review.length > 7 and review[7] != null}" th:href="@{'/admin/listeners/' + ${review[7]}}"
                           style="font-size:1.1rem; font-weight:700; color:var(--brand-primary); text-decoration:none;" th:text="${review[1]}">Listener Name</a>
                        <span th:unless="${review.length > 7 and review[7] != null}"
                              style="font-size:1.1rem; font-weight:700; color:var(--text-primary);" th:text="${review[1]}">Listener Name</span>
                    </div>
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; display:block; margin-bottom:0.25rem;">Rating</span>
                        <span style="font-size:1.1rem; font-weight:700; color:#f59e0b; display:inline-flex; align-items:center; gap:0.25rem;">
                            <i class="fa-solid fa-star"></i>
                            <span th:text="${review[3]}">5</span> / 5
                        </span>
                    </div>
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; display:block; margin-bottom:0.25rem;">Review Date</span>
                        <span style="font-size:0.95rem; font-weight:600; color:var(--text-secondary);" th:text="${review[5] != null ? review[5].toString().substring(0, 16) : '—'}">2026-08-20</span>
                    </div>
                </div>

                <div>
                    <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; display:block; margin-bottom:0.5rem;">Full Review Comment</span>
                    <div style="background:var(--bg-subtle, #f9fafb); border:1px solid var(--border-color); border-radius:var(--radius-sm, 6px); padding:1.25rem; font-size:0.95rem; line-height:1.7; color:var(--text-primary); white-space:pre-wrap;"
                         th:text="${review[4] != null and !review[4].toString().isEmpty() ? review[4] : 'No written comment provided.'}">
                        Review content goes here...
                    </div>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
