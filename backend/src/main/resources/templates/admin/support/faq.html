<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | FAQs</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='faq')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">FAQ Management</span>
            </nav>
            <div class="admin-topbar-right">
                <a th:href="@{/admin/support/faq/add}" class="btn-primary" style="font-size:0.8rem;padding:0.45rem 0.9rem;">
                    <i class="fa-solid fa-plus"></i> Add FAQ
                </a>
            </div>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Frequently Asked Questions</h1>
                    <p class="admin-page-subtitle">Manage customer help questions and knowledge base.</p>
                </div>
            </div>

            <div th:if="${successMsg}" class="alert alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${successMsg}"></span></div>
            <div th:if="${errorMsg}"   class="alert alert-error"><i class="fa-solid fa-circle-xmark"></i> <span th:text="${errorMsg}"></span></div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-circle-question"></i> All FAQs</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${faqs.size()} + ' questions'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:70px;">ID</th>
                                <th>Question</th>
                                <th>Answer</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th style="width:90px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${faqs.isEmpty()}">
                                <td colspan="6" style="text-align:center;padding:3rem;color:var(--text-muted);">No FAQs configured.</td>
                            </tr>
                            <tr th:each="f : ${faqs}">
                                <td th:text="'#' + ${f[0]}">#1</td>
                                <td style="font-weight:600;" th:text="${f[1]}">Question</td>
                                <td style="color:var(--text-muted);font-size:0.85rem;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${f[2]}">Answer</td>
                                <td>
                                    <span class="badge" th:classappend="${f[3] == 'Published' ? 'badge-active' : 'badge-gray'}" th:text="${f[3]}">Published</span>
                                </td>
                                <td style="font-size:0.8rem;color:var(--text-muted);" th:text="${f[4]}">2026-01-01</td>
                                <td style="white-space:nowrap;">
                                    <a th:href="@{/admin/support/faq/edit/{id}(id=${f[0]})}" class="action-btn action-btn-edit" title="Edit FAQ" style="margin-right:0.35rem;">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </a>
                                    <form th:action="@{/admin/support/faq/delete/{id}(id=${f[0]})}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Are you sure you want to delete this FAQ?');">
                                        <button type="submit" class="action-btn action-btn-danger" title="Delete FAQ">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
