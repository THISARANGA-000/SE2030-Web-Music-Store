<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Reviews</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='reviews')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Reviews</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Review Management</h1>
                    <p class="admin-page-subtitle">View and manage listener album reviews.</p>
                </div>
            </div>

            <div th:if="${successMsg}" class="alert alert-success">
                <i class="fa-solid fa-circle-check"></i> <span th:text="${successMsg}"></span>
            </div>
            <div th:if="${errorMsg}" class="alert alert-error">
                <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${errorMsg}"></span>
            </div>

            <div class="admin-table-wrap">
                <div class="admin-table-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                    <div style="display:flex; align-items:center; gap:0.75rem;">
                        <span class="admin-table-title"><i class="fa-solid fa-star" style="color:#f59e0b;"></i> All Reviews</span>
                        <span style="font-size:0.8rem; background:var(--bg-elevated); padding:0.2rem 0.6rem; border-radius:var(--radius-full); color:var(--text-secondary); font-weight:600;"
                              th:text="${reviews.size()} + ' reviews'">0</span>
                    </div>
                    <div>
                        <input type="text" id="reviewSearchInput" onkeyup="filterReviewsTable()" placeholder="Search album, listener, or ID..."
                               class="form-control" style="font-size:0.82rem; padding:0.35rem 0.75rem; width:250px;">
                    </div>
                </div>

                <div style="overflow-x:auto;">
                    <table class="admin-table" id="reviewsTable">
                        <thead>
                            <tr>
                                <th style="width:90px;">Review ID</th>
                                <th>Album</th>
                                <th>Listener</th>
                                <th style="width:110px;">Rating</th>
                                <th>Review</th>
                                <th style="width:120px;">Date</th>
                                <th style="width:140px; text-align:right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${reviews.isEmpty()}" id="noReviewsRow">
                                <td colspan="7" style="text-align:center; padding:3.5rem; color:var(--text-muted);">
                                    <i class="fa-regular fa-comment-dots" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
                                    <strong>No reviews found.</strong>
                                </td>
                            </tr>
                            <tr th:each="r : ${reviews}">
                                <td><strong th:text="'#' + ${r[0]}">#1</strong></td>
                                <td>
                                    <span style="font-weight:600; color:var(--text-primary);" th:text="${r[2]}">—</span>
                                </td>
                                <td>
                                    <span style="color:var(--text-secondary);" th:text="${r[1]}">—</span>
                                </td>
                                <td>
                                    <span style="color:#f59e0b; font-size:0.9rem; font-weight:700; display:inline-flex; align-items:center; gap:0.25rem;">
                                        <i class="fa-solid fa-star"></i>
                                        <span th:text="${r[3]}">5</span><span style="color:var(--text-muted); font-size:0.75rem; font-weight:normal;">/5</span>
                                    </span>
                                </td>
                                <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary);"
                                    th:text="${r[4] != null and !r[4].isEmpty() ? r[4] : '—'}"
                                    th:title="${r[4]}">—</td>
                                <td th:text="${r[5] != null ? r[5].toString().substring(0,10) : '—'}">—</td>
                                <td style="text-align:right;">
                                    <div style="display:inline-flex; align-items:center; gap:0.4rem;">
                                        <a th:href="@{/admin/support/reviews/{id}(id=${r[0]})}" class="btn-secondary"
                                           style="padding:0.35rem 0.65rem; font-size:0.78rem;" title="View Full Review">
                                            <i class="fa-solid fa-eye"></i> View
                                        </a>
                                        <form th:action="@{/admin/support/reviews/{id}/delete(id=${r[0]})}" method="post" style="display:inline;"
                                              onsubmit="return confirm('Are you sure you want to delete this review?');">
                                            <button type="submit" class="btn-secondary"
                                                    style="padding:0.35rem 0.65rem; font-size:0.78rem; color:#ef4444; border-color:#fca5a5;" title="Delete Review">
                                                <i class="fa-solid fa-trash"></i> Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>

<script>
function filterReviewsTable() {
    var input = document.getElementById("reviewSearchInput");
    var filter = input.value.toLowerCase();
    var table = document.getElementById("reviewsTable");
    var tr = table.getElementsByTagName("tr");

    for (var i = 1; i < tr.length; i++) {
        if (tr[i].id === 'noReviewsRow') continue;
        var text = tr[i].textContent || tr[i].innerText;
        if (text.toLowerCase().indexOf(filter) > -1) {
            tr[i].style.display = "";
        } else {
            tr[i].style.display = "none";
        }
    }
}
</script>
</body>
</html>
