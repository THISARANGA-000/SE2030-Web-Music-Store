<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart Admin | Listeners</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(activeItem='listeners')}"></div>
    <div class="admin-content">
        <div class="admin-topbar">
            <nav class="admin-breadcrumb">
                <a th:href="@{/admin/dashboard}">Dashboard</a>
                <span class="admin-breadcrumb-sep">/</span>
                <span class="admin-breadcrumb-current">Listeners</span>
            </nav>
        </div>
        <main class="admin-main">
            <div class="admin-page-header">
                <div>
                    <h1 class="admin-page-title">Listener Management</h1>
                    <p class="admin-page-subtitle">View and search registered listeners.</p>
                </div>
            </div>

            <!-- Search bar -->
            <div class="filter-section" style="margin-bottom:1.5rem;">
                <form th:action="@{/admin/listeners}" method="get" class="filter-form">
                    <div class="search-input-group">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" name="search" class="form-control" placeholder="Search by name or email..."
                               th:value="${search}">
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                    <a th:href="@{/admin/listeners}" class="btn-reset"><i class="fa-solid fa-rotate-left"></i> Reset</a>
                </form>
            </div>

            <div class="admin-table-wrap">
                <div class="admin-table-header">
                    <span class="admin-table-title"><i class="fa-solid fa-headphones"></i> Listeners</span>
                    <span style="font-size:0.8rem;color:var(--text-muted);" th:text="${listeners.size()} + ' found'">0</span>
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table" id="listenersTable">
                        <thead>
                            <tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th><th>Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:if="${listeners.isEmpty()}">
                                <td colspan="7" style="text-align:center;padding:3rem;color:var(--text-muted);">No listeners found.</td>
                            </tr>
                            <tr th:each="l : ${listeners}">
                                <td th:text="${l[0]}">1</td>
                                <td><strong th:text="${l[1] + ' ' + l[2]}">Name</strong></td>
                                <td th:text="${l[3]}">email</td>
                                <td th:text="${l[4] != null ? l[4] : '—'}">—</td>
                                <td th:text="${l[5] != null ? l[5].toString().substring(0,10) : '—'}">—</td>
                                <td>
                                    <span th:switch="${l[6]}">
                                        <span th:case="'Active'"    class="chip chip-green"  th:text="${l[6]}">Active</span>
                                        <span th:case="'Suspended'" class="chip chip-red"    th:text="${l[6]}">Suspended</span>
                                        <span th:case="*"           class="chip chip-gray"   th:text="${l[6]}">—</span>
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/listeners/{id}(id=${l[0]})}" class="btn-view">
                                        <i class="fa-solid fa-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="admin-footer">&copy; 2026 MelodyMart &mdash; All rights reserved.</footer>
    </div>
</div>
</body>
</html>
