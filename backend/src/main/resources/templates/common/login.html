<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart | Sign In</title>
    <meta name="description" content="Sign in to your MelodyMart account to access your music library.">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

<div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
        <a th:href="@{/albums}">
            <span class="logo-icon"><i class="fa-solid fa-compact-disc"></i></span>
            MelodyMart
        </a>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>



    <!-- Success / Error alerts -->
    <div th:if="${successMsg}" class="alert alert-success" id="successAlert">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="alert alert-error" id="errorAlert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMsg}"></span>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post" id="loginForm">
        <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" name="email" class="form-control"
                       placeholder="your@email.com" required autocomplete="email">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" name="password" class="form-control"
                       placeholder="Enter your password" required autocomplete="current-password">
            </div>
        </div>
        <button type="submit" id="loginSubmitBtn" class="btn-primary btn-full">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
    </form>

    <hr class="divider">

    <div class="auth-footer">
        Don't have an account?
        <a th:href="@{/register}" id="goToRegister">Create one for free</a>
    </div>

</div>

</body>
</html>
