<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart | Create Account</title>
    <meta name="description" content="Register a free MelodyMart listener account.">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

<div class="auth-card" style="max-width:480px;">

    <!-- Logo -->
    <div class="auth-logo">
        <a th:href="@{/albums}">
            <span class="logo-icon"><i class="fa-solid fa-compact-disc"></i></span>
            MelodyMart
        </a>
    </div>

    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join MelodyMart and explore thousands of albums</p>

    <!-- Error alert -->
    <div th:if="${errorMsg}" class="alert alert-error" id="registerErrorAlert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMsg}"></span>
    </div>

    <!-- Registration Form -->
    <form th:action="@{/register}" method="post" id="registerForm">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
            <div class="form-group">
                <label class="form-label" for="regFirstName">First Name</label>
                <div class="input-icon-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regFirstName" name="firstName" class="form-control"
                           placeholder="First name" required
                           th:value="${firstName}">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="regLastName">Last Name</label>
                <div class="input-icon-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regLastName" name="lastName" class="form-control"
                           placeholder="Last name" required
                           th:value="${lastName}">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="regEmail">Email Address</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="regEmail" name="email" class="form-control"
                       placeholder="your@email.com" required autocomplete="email"
                       th:value="${email}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="regPhone">Phone Number <span style="color:var(--text-muted)">(optional)</span></label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="regPhone" name="phone" class="form-control"
                       placeholder="+1-555-0000"
                       th:value="${phone}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="regPassword">Password</label>
            <div class="input-icon-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="regPassword" name="password" class="form-control"
                       placeholder="Choose a password" required minlength="6" autocomplete="new-password">
            </div>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn-primary btn-full">
            <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
    </form>

    <hr class="divider">

    <div class="auth-footer">
        Already have an account? <a th:href="@{/login}" id="goToLogin">Sign in</a>
    </div>

</div>

</body>
</html>
