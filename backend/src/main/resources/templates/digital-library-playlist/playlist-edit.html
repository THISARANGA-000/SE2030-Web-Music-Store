<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyMart | Rename Playlist</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div th:replace="~{fragments/listener-nav :: navbar(activeItem='playlists')}"></div>

<main class="container" style="max-width:560px;">

    <a th:href="@{'/playlists/' + ${playlist != null ? playlist.playlistId : ''}}" class="back-link"
       style="display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1.5rem; color:var(--text-secondary); font-size:0.9rem; text-decoration:none;">
        <i class="fa-solid fa-arrow-left"></i> Back to Playlist
    </a>

    <div class="card" style="padding:2rem;">
        <h1 class="page-title" style="font-size:1.5rem; margin-bottom:0.5rem;">
            <i class="fa-solid fa-pen" style="color:var(--brand-primary); font-size:0.85em;"></i> Rename Playlist
        </h1>
        <p style="color:var(--text-secondary); margin-bottom:1.5rem; font-size:0.95rem;"
           th:text="'Renaming: ' + (${playlist != null ? playlist.playlistName : ''})">Renaming playlist</p>

        <div th:if="${errorMsg}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{'/playlists/' + ${playlist != null ? playlist.playlistId : ''} + '/edit'}" method="post" id="renamePlaylistForm">
            <div class="form-group">
                <label class="form-label" for="playlistNameEditInput">New Playlist Name <span style="color:var(--error);">*</span></label>
                <input type="text" id="playlistNameEditInput" name="playlistName" class="form-control"
                       th:value="${playlist != null ? playlist.playlistName : ''}"
                       maxlength="100" required autofocus>
            </div>
            <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
                <button type="submit" class="btn-primary" id="saveRenameBtn">
                    <i class="fa-solid fa-check"></i> Save
                </button>
                <a th:href="@{'/playlists/' + ${playlist != null ? playlist.playlistId : ''}}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer class="footer"><p>&copy; 2026 MelodyMart Digital Music Store &mdash; All rights reserved.</p></footer>
</body>
</html>
